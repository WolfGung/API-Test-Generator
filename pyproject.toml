[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-test-gen"
version = "0.1.0"
description = "Turns an OpenAPI 3 document or a Postman collection into a runnable pytest suite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pytest>=8.3",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "fastapi>=0.115", "uvicorn>=0.32"]

[project.scripts]
api-test-gen = "api_test_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api_test_gen = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "live: starts the sample API and runs a generated suite against it",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Generated suites carry example values verbatim; a long example string is data, not style.
per-file-ignores = { "examples/*" = ["E501"] }

[tool.ruff.lint.isort]
known-first-party = ["api_test_gen", "sample_api", "tools"]
